apis:
- aid: viridi-parente:viridi-parente-vista
  name: Viridi ViSTA Platform API
  description: 'The REST API of ViSTA (Viridi Insights), Viridi''s energy management and IIoT platform.
    ViSTA is a Viridi-operated deployment of the open-source ThingsBoard IoT platform (v3.7.0) served
    from vista.viridiparente.com, extended with Viridi-authored controllers: SBR30 battery telemetry and
    data, generator and chiller latest-value reads, CBRS device registration and configuration, and Moxion
    AEMP equipment telematics and fault feeds. All operations require an authenticated ViSTA account;
    the OpenAPI contract itself is served anonymously.'
