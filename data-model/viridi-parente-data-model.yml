    via: assets
first_party_surface:
  note: >-
    The Viridi-authored controllers return untyped `object` / JsonNode bodies, so no schema
    can be derived for SBR30 data, generator/chiller latest values, CBRS state or Moxion
    AEMP payloads. That is a real gap in the published contract, not a gap in this profile.
