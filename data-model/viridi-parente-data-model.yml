    via: tenantId
  - belongs_to: DeviceProfile
    via: deviceProfileId
- name: TelemRequest
  description: >-
    Viridi-authored request body for POST /api/telem (getSBR30Telem) — the SBR30 bulk
    telemetry read. Not a ThingsBoard type.
  fields:
  - assets (array of string)
  - keys (map of string -> array of string)
