tags:
- name: entity-query-controller
paths:
  /api/entitiesQuery/find:
    post:
      tags:
      - entity-query-controller
      summary: Find Entity Data by Query
      description: 'Allows to run complex queries over platform entities (devices, assets, customers, etc) based on the combination of main entity filter and multiple key filters. Returns the paginated result of the query that contains requested entity fields and latest values of requested attributes and time-series data. # Query Definition


        Main **entity filter** is mandatory and defines generic search criteria. For example, "find all devices with profile ''Moisture Sensor''" or "Find all devices related to asset ''Building A''"


        Optional **key filters** allow to filter results of the **entity filter** by complex criteria against main entity fields (name, label, type, etc), attributes and telemetry. For example, "temperature > 20 or temperature 40". The **entity fields** and **latest values** contains list of entity fields and latest attribute/telemetry fields to fetch for each entity. The **page link** contains information about the page to fetch and the sort ordering. Let''s review the example:


        ```json

        {

        "entityFilter": {

        "type": "entityType",

        "resolveMultiple": true,

        "entityType": "DEVICE"

        },

        "keyFilters": [

        {

        "key": {

        "type": "TIME_SERIES",

        "key": "temperature"

        },

        "valueType": "NUMERIC",

        "predicate": {

        "operation": "GREATER",

        "value": {

        "defaultValue": 0,

        "dynamicValue": {

        "sourceType": "CURRENT_USER",

        "sourceAttribute": "temperatureThreshold",

        "inherit": false

        }

        },

        "type": "NUMERIC"

        }

        }

        ],

        "entityFields": [

        {

        "type": "ENTITY_FIELD",

        "key": "name"

        },

        {

        "type": "ENTITY_FIELD",

        "key": "label"

        },

        {

        "type": "ENTITY_FIELD",

        "key": "additionalInfo"

        }

        ],

        "latestValues": [

        {

        "type": "ATTRIBUTE",

        "key": "model"

        },

        {

        "type": "TIME_SERIES",

        "key": "temperature"

        }

        ],

        "pageLink": {

        "page": 0,

        "pageSize": 10,

        "sortOrder": {

        "key": {

        "key": "name",

        "type": "ENTITY_FIELD"

        },

        "direction": "ASC"

        }

        }

        }

        ```


        Example mentioned above search all devices which have attribute ''active'' set to ''true''. Now let''s review available entity filters and key filters syntax:


        # Entity Filters

        Entity Filter body depends on the ''type'' parameter. Let''s review available entity filter types. In fact, they do correspond to available dashboard aliases. ## Single Entity


        Allows to filter only one entity based on the id. For example, this entity filter selects certain device:


        ```json

        {

        "type": "singleEntity",

        "singleEntity": {

        "id": "d521edb0-2a7a-11ec-94eb-213c95f54092",

        "entityType": "DEVICE"

        }

        }

        ```


        ## Entity List Filter


        Allows to filter entities of the same type using their ids. For example, this entity filter selects two devices:


        ```json

        {

        "type": "entityList",

        "entityType": "DEVICE",

        "entityList": [

        "e6501f30-2a7a-11ec-94eb-213c95f54092",

        "e6657bf0-2a7a-11ec-94eb-213c95f54092"

        ]

        }

        ```


        ## Entity Name Filter


        Allows to filter entities of the same type using the **''starts with''** expression over entity name. For example, this entity filter selects all devices which name starts with ''Air Quality'':


        ```json

        {

        "type": "entityName",

        "entityType": "DEVICE",

        "entityNameFilter": "Air Quality"

        }

        ```


        ## Entity Type Filter


        Allows to filter entities based on their type (CUSTOMER, USER, DASHBOARD, ASSET, DEVICE, etc)For example, this entity filter selects all tenant customers:


        ```json

        {

        "type": "entityType",

        "entityType": "CUSTOMER"

        }

        ```


        ## Asset Type Filter


        Allows to filter assets based on their type and the **''starts with''** expression over their name. For example, this entity filter selects all ''charging station'' assets which name starts with ''Tesla'':


        ```json

        {

        "type": "assetType",

        "assetType": "charging station",

        "assetNameFilter": "Tesla"

        }

        ```


        ## Device Type Filter


        Allows to filter devices based on their type and the **''starts with''** expression over their name.'
      operationId: findEntityDataByQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityDataQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDataEntityData'
  /api/entitiesQuery/find/keys:
    post:
      tags:
      - entity-query-controller
      summary: Find Entity Keys by Query
      description: Uses entity data query (see 'Find Entity Data by Query') to find first 100 entities. Then fetch and return all unique time-series and/or attribute keys. Used mostly for UI hints.
      operationId: findEntityTimeseriesAndAttributesKeysByQuery
      parameters:
      - name: timeseries
        in: query
        description: Include all unique time-series keys to the result.
        required: true
        schema:
          type: boolean
      - name: attributes
        in: query
        description: Include all unique attribute keys to the result.
        required: true
        schema:
          type: boolean
      - name: scope
        in: query
        description: A string value representing the attributes scope. For example, 'SERVER_SCOPE'.
        required: false
        schema:
          enum:
          - SERVER_SCOPE
          - SHARED_SCOPE
          - CLIENT_SCOPE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityDataQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/entitiesQuery/count:
    post:
      tags:
      - entity-query-controller
      summary: Count Entities by Query
      description: 'Allows to run complex queries to search the count of platform entities (devices, assets, customers, etc) based on the combination of main entity filter and multiple key filters. Returns the number of entities that match the query definition. # Query Definition


        Main **entity filter** is mandatory and defines generic search criteria. For example, "find all devices with profile ''Moisture Sensor''" or "Find all devices related to asset ''Building A''"


        Optional **key filters** allow to filter results of the entity filter by complex criteria against main entity fields (name, label, type, etc), attributes and telemetry. For example, "temperature > 20 or temperature 40". Let''s review the example:


        ```json

        {

        "entityFilter": {

        "type": "entityType",

        "entityType": "DEVICE"

        },

        "keyFilters": [

        {

        "key": {

        "type": "ATTRIBUTE",

        "key": "active"

        },

        "valueType": "BOOLEAN",

        "predicate": {

        "operation": "EQUAL",

        "value": {

        "defaultValue": true,

        "dynamicValue": null

        },

        "type": "BOOLEAN"

        }

        }

        ]

        }

        ```


        Example mentioned above search all devices which have attribute ''active'' set to ''true''. Now let''s review available entity filters and key filters syntax:


        # Entity Filters

        Entity Filter body depends on the ''type'' parameter. Let''s review available entity filter types. In fact, they do correspond to available dashboard aliases. ## Single Entity


        Allows to filter only one entity based on the id. For example, this entity filter selects certain device:


        ```json

        {

        "type": "singleEntity",

        "singleEntity": {

        "id": "d521edb0-2a7a-11ec-94eb-213c95f54092",

        "entityType": "DEVICE"

        }

        }

        ```


        ## Entity List Filter


        Allows to filter entities of the same type using their ids. For example, this entity filter selects two devices:


        ```json

        {

        "type": "entityList",

        "entityType": "DEVICE",

        "entityList": [

        "e6501f30-2a7a-11ec-94eb-213c95f54092",

        "e6657bf0-2a7a-11ec-94eb-213c95f54092"

        ]

        }

        ```


        ## Entity Name Filter


        Allows to filter entities of the same type using the **''starts with''** expression over entity name. For example, this entity filter selects all devices which name starts with ''Air Quality'':


        ```json

        {

        "type": "entityName",

        "entityType": "DEVICE",

        "entityNameFilter": "Air Quality"

        }

        ```


        ## Entity Type Filter


        Allows to filter entities based on their type (CUSTOMER, USER, DASHBOARD, ASSET, DEVICE, etc)For example, this entity filter selects all tenant customers:


        ```json

        {

        "type": "entityType",

        "entityType": "CUSTOMER"

        }

        ```


        ## Asset Type Filter


        Allows to filter assets based on their type and the **''starts with''** expression over their name. For example, this entity filter selects all ''charging station'' assets which name starts with ''Tesla'':


        ```json

        {

        "type": "assetType",

        "assetType": "charging station",

        "assetNameFilter": "Tesla"

        }

        ```


        ## Device Type Filter


        Allows to filter devices based on their type and the **''starts with''** expression over their name. For example, this entity filter selects all ''Temperature Sensor'' devices which name starts with ''ABC'':


        ```json

        {

        "type": "deviceType",

        "deviceType": "Temperature Sensor",

        "deviceNameFilter": "ABC"

        }

        ```


        ## Edge Type Filter


        Allows to filter edge instances based on their type and the **''starts with''** expression over their name. For example, this entity filter selects all ''Factory'' edge instances which name starts with ''Nevada'':


        ```json

        {

        "type": "edgeType",

        "edgeType": "Factory",

        "edgeNameFilter": "Nevada"

        }

        ```


        ## Entity View Filter


        Allows to filter entity views based on their type and the **''starts with''** expression over their name. For example, this entity filter selects all ''Concrete Mixer'' entity views which name starts with ''CAT'':


        ```json

        {

        "type": "entityViewType",

        "entityViewType": "Concrete Mixer",

        "entityViewNameFilter": "CAT"

        }

        ```


        ## Api Usage Filter


        Allows to query for Api Usage based on optional customer id.'
      operationId: countEntitiesByQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCountQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
  /api/alarmsQuery/find:
    post:
      tags:
      - entity-query-controller
      summary: Find Alarms by Query
      description: 'This method description defines how Alarm Data Query extends the Entity Data Query. See method ''Find Entity Data by Query'' first to get the info about ''Entity Data Query''.


        The platform will first search the entities that match the entity and key filters. Then, the platform will use ''Alarm Page Link'' to filter the alarms related to those entities. Finally, platform fetch the properties of alarm that are defined in the **''alarmFields''** and combine them with the other entity, attribute and latest time-series fields to return the result.


        See example of the alarm query below. The query will search first 100 active alarms with type ''Temperature Alarm'' or ''Fire Alarm'' for any device with current temperature > 0. The query will return combination of the entity fields: name of the device, device model and latest temperature reading and alarms fields: createdTime, type, severity and status:


        ```json

        {

        "entityFilter": {

        "type": "entityType",

        "resolveMultiple": true,

        "entityType": "DEVICE"

        },

        "pageLink": {

        "page": 0,

        "pageSize": 100,

        "textSearch": null,

        "searchPropagatedAlarms": false,

        "statusList": [

        "ACTIVE"

        ],

        "severityList": [

        "CRITICAL",

        "MAJOR"

        ],

        "typeList": [

        "Temperature Alarm",

        "Fire Alarm"

        ],

        "sortOrder": {

        "key": {

        "key": "createdTime",

        "type": "ALARM_FIELD"

        },

        "direction": "DESC"

        },

        "timeWindow": 86400000

        },

        "keyFilters": [

        {

        "key": {

        "type": "TIME_SERIES",

        "key": "temperature"

        },

        "valueType": "NUMERIC",

        "predicate": {

        "operation": "GREATER",

        "value": {

        "defaultValue": 0,

        "dynamicValue": null

        },

        "type": "NUMERIC"

        }

        }

        ],

        "alarmFields": [

        {

        "type": "ALARM_FIELD",

        "key": "createdTime"

        },

        {

        "type": "ALARM_FIELD",

        "key": "type"

        },

        {

        "type": "ALARM_FIELD",

        "key": "severity"

        },

        {

        "type": "ALARM_FIELD",

        "key": "status"

        }

        ],

        "entityFields": [

        {

        "type": "ENTITY_FIELD",

        "key": "name"

        }

        ],

        "latestValues": [

        {

        "type": "ATTRIBUTE",

        "key": "model"

        },

        {

        "type": "TIME_SERIES",

        "key": "temperature"

        }

        ]

        }

        ```'
      operationId: findAlarmDataByQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmDataQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDataAlarmData'
  /api/alarmsQuery/count:
    post:
      tags:
      - entity-query-controller
      summary: Count Alarms by Query (countAlarmsByQuery)
      description: Returns the number of alarms that match the query definition.
      operationId: countAlarmsByQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmCountQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
components:
  schemas:
    DeviceTypeFilter:
      allOf:
      - $ref: '#/components/schemas/EntityFilter'
      - type: object
        properties:
          deviceType:
            type: string
            deprecated: true
            writeOnly: true
          deviceTypes:
            type: array
            items:
              type: string
          deviceNameFilter:
            type: string
    EntityKey:
      properties:
        type:
          type: string
          enum:
          - ATTRIBUTE
          - CLIENT_ATTRIBUTE
          - SHARED_ATTRIBUTE
          - SERVER_ATTRIBUTE
          - TIME_SERIES
          - ENTITY_FIELD
          - ALARM_FIELD
        key:
          type: string
    PageDataAlarmData:
      properties:
        data:
          type: array
          description: Array of the entities
          items:
            $ref: '#/components/schemas/AlarmData'
          readOnly: true
        totalPages:
          type: integer
          format: int32
          description: Total number of available pages. Calculated based on the 'pageSize' request parameter and total number of entities that match search criteria
          readOnly: true
        totalElements:
          type: integer
          format: int64
          description: Total number of elements in all available pages
          readOnly: true
        hasNext:
          type: boolean
          description: '''false'' value indicates the end of the result set'
          readOnly: true
    AssetSearchQueryFilter:
      allOf:
      - $ref: '#/components/schemas/EntityFilter'
      - type: object
        properties:
          rootEntity:
            $ref: '#/components/schemas/EntityId'
          relationType:
            type: string
          direction:
            type: string
            enum:
            - FROM
            - TO
          maxLevel:
            type: integer
            format: int32
          fetchLastLevelOnly:
            type: boolean
          assetTypes:
            type: array
            items:
              type: string
    DynamicValueString:
      properties:
        sourceType:
          type: string
          enum:
          - CURRENT_TENANT
          - CURRENT_CUSTOMER
          - CURRENT_USER
          - CURRENT_DEVICE
        sourceAttribute:
          type: string
        inherit:
          type: boolean
    EntityDataSortOrder:
      properties:
        key:
          $ref: '#/components/schemas/EntityKey'
        direction:
          type: string
          enum:
          - ASC
          - DESC
    EntityViewSearchQueryFilter:
      allOf:
      - $ref: '#/components/schemas/EntityFilter'
      - type: object
        properties:
          rootEntity:
            $ref: '#/components/schemas/EntityId'
          relationType:
            type: string
          direction:
            type: string
            enum:
            - FROM
            - TO
          maxLevel:
            type: integer
            format: int32
          fetchLastLevelOnly:
            type: boolean
          entityViewTypes:
            type: array
            items:
              type: string
    EntityData:
      properties:
        entityId:
          $ref: '#/components/schemas/EntityId'
        latest:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/TsValue'
        timeseries:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TsValue'
        aggLatest:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComparisonTsValue'
    AlarmCountQuery:
      description: A JSON value representing the alarm count query.
      properties:
        startTs:
          type: integer
          format: int64
        endTs:
          type: integer
          format: int64
        timeWindow:
          type: integer
          format: int64
        typeList:
          type: array
          items:
            type: string
        statusList:
          type: array
          items:
            type: string
            enum:
            - ANY
            - ACTIVE
            - CLEARED
            - ACK
            - UNACK
        severityList:
          type: array
          items:
            type: string
            enum:
            - CRITICAL
            - MAJOR
            - MINOR
            - WARNING
            - INDETERMINATE
        searchPropagatedAlarms:
          type: boolean
        assigneeId:
          $ref: '#/components/schemas/UserId'
        entityFilter:
          oneOf:
          - $ref: '#/components/schemas/ApiUsageStateFilter'
          - $ref: '#/components/schemas/AssetSearchQueryFilter'
          - $ref: '#/components/schemas/AssetTypeFilter'
          - $ref: '#/components/schemas/DeviceSearchQueryFilter'
          - $ref: '#/components/schemas/DeviceTypeFilter'
          - $ref: '#/components/schemas/EdgeSearchQueryFilter'
          - $ref: '#/components/schemas/EdgeTypeFilter'
          - $ref: '#/components/schemas/EntityListFilter'
          - $ref: '#/components/schemas/EntityNameFilter'
          - $ref: '#/components/schemas/EntityTypeFilter'
          - $ref: '#/components/schemas/EntityViewSearchQueryFilter'
          - $ref: '#/components/schemas/EntityViewTypeFilter'
          - $ref: '#/components/schemas/RelationsQueryFilter'
          - $ref: '#/components/schemas/SingleEntityFilter'
        keyFilters:
          type: array
          items:
            $ref: '#/components/schemas/KeyFilter'
    EntityDataQuery:
      description: A JSON value representing the entity data query. See API call notes above for more details.
      properties:
        entityFilter:
          oneOf:
          - $ref: '#/components/schemas/ApiUsageStateFilter'
          - $ref: '#/components/schemas/AssetSearchQueryFilter'
          - $ref: '#/components/schemas/AssetTypeFilter'
          - $ref: '#/components/schemas/DeviceSearchQueryFilter'
          - $ref: '#/components/schemas/DeviceTypeFilter'
          - $ref: '#/components/schemas/EdgeSearchQueryFilter'
          - $ref: '#/components/schemas/EdgeTypeFilter'
          - $ref: '#/components/schemas/EntityListFilter'
          - $ref: '#/components/schemas/EntityNameFilter'
          - $ref: '#/components/schemas/EntityTypeFilter'
          - $ref: '#/components/schemas/EntityViewSearchQueryFilter'
          - $ref: '#/components/schemas/EntityViewTypeFilter'
          - $ref: '#/components/schemas/RelationsQueryFilter'
          - $ref: '#/components/schemas/SingleEntityFilter'
        keyFilters:
          type: array
          items:
            $ref: '#/components/schemas/KeyFilter'
        pageLink:
          $ref: '#/components/schemas/EntityDataPageLink'
        entityFields:
          type: array
          items:
            $ref: '#/components/schemas/EntityKey'
        latestValues:
          type: array
          items:
            $ref: '#/components/schemas/EntityKey'
    DeviceSearchQueryFilter:
      allOf:
      - $ref: '#/components/schemas/EntityFilter'
      - type: object
        properties:
          rootEntity:
            $ref: '#/components/schemas/EntityId'
          relationType:
            type: string
          direction:
            type: string
            enum:
            - FROM
            - TO
          maxLevel:
            type: integer
            format: int32
          fetchLastLevelOnly:
            type: boolean
          deviceTypes:
            type: array
            items:
              type: string
    KeyFilter:
      properties:
        key:
          $ref: '#/components/schemas/EntityKey'
        valueType:
          type: string
          enum:
          - STRING
          - NUMERIC
          - BOOLEAN
          - DATE_TIME
        predicate:
          oneOf:
          - $ref: '#/components/schemas/BooleanFilterPredicate'
          - $ref: '#/components/schemas/ComplexFilterPredicate'
          - $ref: '#/components/schemas/NumericFilterPredicate'
          - $ref: '#/components/schemas/StringFilterPredicate'
    TsValue:
      properties:
        ts:
          type: integer
          format: int64
        value:
          type: string
        count:
          type: integer
          format: int64
    DynamicValueBoolean:
      properties:
        sourceType:
          type: string
          enum:
          - CURRENT_TENANT
          - CURRENT_CUSTOMER
          - CURRENT_USER
          - CURRENT_DEVICE
        sourceAttribute:
          type: string
        inherit:
          type: boolean
    FilterPredicateValueBoolean:
      properties:
        defaultValue:
          type: boolean
        userValue:
          type: boolean
        dynamicValue:
          $ref: '#/components/schemas/DynamicValueBoolean'
    AlarmDataQuery:
      description: A JSON value representing the alarm data query. See API call notes above for more details.
      properties:
        entityFilter:
          oneOf:
          - $ref: '#/components/schemas/ApiUsageStateFilter'
          - $ref: '#/components/schemas/AssetSearchQueryFilter'
          - $ref: '#/components/schemas/AssetTypeFilter'
          - $ref: '#/components/schemas/DeviceSearchQueryFilter'
          - $ref: '#/components/schemas/DeviceTypeFilter'
          - $ref: '#/components/schemas/EdgeSearchQueryFilter'
          - $ref: '#/components/schemas/EdgeTypeFilter'
          - $ref: '#/components/schemas/EntityListFilter'
          - $ref: '#/components/schemas/EntityNameFilter'
          - $ref: '#/components/schemas/EntityTypeFilter'
          - $ref: '#/components/schemas/EntityViewSearchQueryFilter'
          - $ref: '#/components/schemas/EntityViewTypeFilter'
          - $ref: '#/components/schemas/RelationsQueryFilter'
          - $ref: '#/components/schemas/SingleEntityFilter'
        keyFilters:
          type: array
          items:
            $ref: '#/components/schemas/KeyFilter'
        pageLink:
          $ref: '#/components/schemas/AlarmDataPageLink'
        entityFields:
          type: array
          items:
            $ref: '#/components/schemas/EntityKey'
        latestValues:
          type: array
          items:
            $ref: '#/components/schemas/EntityKey'
        alarmFields:
          type: array
          items:
            $ref: '#/components/schemas/EntityKey'
    UserId:
      properties:
        id:
          type: string
          format: uuid
          description: ID of the entity, time-based UUID v1
          example: 784f394c-42b6-435a-983c-b7beff2784f9
        entityType:
          type: string
          description: string
          enum:
          - USER
          example: USER
      required:
      - entityType
      - id
    ComplexFilterPredicate:
      allOf:
      - $ref: '#/components/schemas/KeyFilterPredicate'
      - type: object
        properties:
          operation:
            type: string
            enum:
            - AND
            - OR
          predicates:
            type: array
            items:
              $ref: '#/components/schemas/KeyFilterPredicate'
    StringFilterPredicate:
      allOf:
      - $ref: '#/components/schemas/KeyFilterPredicate'
      - type: object
        properties:
          operation:
            type: string
            enum:
            - EQUAL
            - NOT_EQUAL
            - STARTS_WITH
            - ENDS_WITH
            - CONTAINS
            - NOT_CONTAINS
            - IN
            - NOT_IN
          value:
            $ref: '#/components/schemas/FilterPredicateValueString'
          ignoreCase:
            type: boolean
    ApiUsageStateFilter:
      allOf:
      - $ref: '#/components/schemas/EntityFilter'
      - type: object
        properties:
          customerId:
            $ref: '#/components/schemas/CustomerId'
    PageDataEntityData:
      properties:
        data:
          type: array
          description: Array of the entities
          items:
            $ref: '#/components/schemas/EntityData'
          readOnly: true
        totalPages:
          type: integer
          format: int32
          description: Total number of available pages. Calculated based on the 'pageSize' request parameter and total number of entities that match search criteria
          readOnly: true
        totalElements:
          type: integer
          format: int64
          description: Total number of elements in all available pages
          readOnly: true
        hasNext:
